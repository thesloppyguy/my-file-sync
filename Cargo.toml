[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/sync-core",
  "services/relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sync-core = { path = "crates/sync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libp2p = { version = "0.56", features = [
  "tokio",
  "tcp",
  "quic",
  "noise",
  "yamux",
  "gossipsub",
  "mdns",
  "relay",
  "dcutr",
  "identify",
  "ping",
  "autonat",
  "request-response",
  "cbor",
  "macros",
] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
